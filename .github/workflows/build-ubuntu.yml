name: build-ubuntu

# Build modules.cpp on each supported Ubuntu LTS, x64 and arm64, using GCC.
# Bootstraps from source, configures, builds, and runs tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # x64 and arm64 for each release: GCC 14's module defects showed up on
        # aarch64 first (drafts/gcc-14-workaround.mdy), so both are built.
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, ubuntu-26.04-arm]
        build: [debug, release]

    steps:
      - uses: actions/checkout@v4

      # bootstrap.sh deliberately invokes the literal command c++, so the
      # default must be a compiler with C++20 module support. GCC 13 has no
      # usable module support and GCC 14 ICEs on this codebase
      # (simplify_aggr_init_expr, cp/semantics.cc), so the build needs GCC 15.
      # ubuntu-24.04 has no g++-15 in its archive and takes it from the
      # toolchain PPA; a release that carries g++-15 itself uses the archive.
      # cppcheck is needed by the test suite, not only by ./check.sh:
      # tests/mm/configure exercises the installed check tool, which wraps
      # cppcheck and exits 127 without it.
      - name: Install dependencies
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME"
          sudo apt-get update
          # Match the exact name: given a name no package has, apt reads it
          # as a regular expression, and g++-15 then matches clang-15.
          if ! apt-cache show g++-15 2>/dev/null | grep -qx 'Package: g++-15'; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
          fi
          # libusb-1.0-0-dev is for platform.linux.usb.host, which the
          # tests/mm/linux suite links on a Linux host.
          sudo apt-get install -y g++-15 cppcheck libusb-1.0-0-dev
          test -x /usr/bin/g++-15
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-15 100

      # bootstrap uses c++; an unconfigured build uses g++. Mixing versions
      # across that boundary is what broke build.yml before.
      - name: Verify GCC compiler
        run: |
          which c++
          c++ --version | head -1
          which g++
          g++ --version | head -1
          test "$(c++ -dumpversion)" = "$(g++ -dumpversion)"

      - name: Bootstrap from source
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure --host --compiler gcc-15 --build ${{ matrix.build }}

      - name: Build
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Check the manifest tree against itself
        run: ./model.sh

      - name: Generate documentation
        run: ./document.sh

      # The recovery path never runs during a successful bootstrap, so it is
      # exercised explicitly: MM_BOOTSTRAP_FALLBACK=1 makes bootstrap.sh skip
      # build0 and build build1 with its own shell commands, so this tests
      # the fallback itself rather than a copy of its file list. A stale out/
      # or gcm.cache would let it pass without recompiling anything, so it
      # runs in a pristine copy.
      - name: Verify the bootstrap fallback
        if: matrix.build == 'debug'
        run: |
          set -o pipefail
          rm -rf /tmp/fallback && mkdir -p /tmp/fallback
          git archive HEAD | tar -x -C /tmp/fallback
          cd /tmp/fallback
          test ! -e out && test ! -e gcm.cache
          MM_BOOTSTRAP_FALLBACK=1 ./bootstrap.sh 2>&1 | tee bootstrap.log
          grep -q 'Build build1 with shell commands' bootstrap.log
          ./out/build1 -h
