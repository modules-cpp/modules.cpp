name: build-macos

# Build modules.cpp on macOS using Clang.
# Bootstraps from source, configures, builds, and runs tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.build }})
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]

    steps:
      - uses: actions/checkout@v4

      # Apple Clang bundled with Xcode does not support ISO C++20 standard
      # modules ('export module' syntax is rejected). Upstream LLVM Clang
      # from Homebrew provides standard C++20 module support.
      # cppcheck is required by the test suite (tests/mm/configure).
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm cppcheck
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          ln -sf "$LLVM_PREFIX/bin/clang++" "$LLVM_PREFIX/bin/c++"

      - name: Verify Clang compiler
        run: |
          which clang++
          clang++ --version
          which c++
          c++ --version

      - name: Bootstrap from source
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure --host --compiler clang++ --build ${{ matrix.build }}

      - name: Build
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Check the manifest tree against itself
        run: ./model.sh

      - name: Generate documentation
        run: ./document.sh
