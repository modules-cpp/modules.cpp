name: build-win32

# Build modules.cpp on Windows inside the MSYS2 MSYS environment.
# Bootstraps from source, configures, builds, and runs tests.
#
# The tools assume POSIX: std::system() backed by /bin/sh, wait statuses from
# sys/wait.h, and single-quoted shell arguments. The MSYS environment provides
# all three, so the code builds unchanged. The executables depend on
# msys-2.0.dll; they are not native Win32 programs. MSYS has no 32-bit
# environment, so this covers 64-bit Windows only. Native win32 and win64
# builds are planned in drafts/plan-win32.mdy.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: msys2 {0}

jobs:
  build:
    name: build (msys, ${{ matrix.build }})
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # MSYS2's default symlink() makes a deep copy, so a symlink a test
      # creates to escape the tree is an ordinary file inside it and the
      # guards under test have nothing to refuse. winsymlinks:sys makes real
      # MSYS symlinks, which every tool here reads through the same runtime.
      MSYS: winsymlinks:sys
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]

    steps:
      - name: Configure git to keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # gcc here is the MSYS POSIX-runtime GCC, not a MinGW-w64 one.
      # cppcheck is needed by the test suite: tests/mm/configure exercises
      # the installed check tool, which wraps cppcheck and exits 127 without
      # it. MSYS has no cppcheck package, so the MinGW-w64 build is installed
      # and reached through a wrapper in /usr/bin; /mingw64/bin is not put on
      # PATH, so it cannot shadow the MSYS toolchain. Its addon runs on
      # python. cmake is needed by tests/mm/build/external.cpp, which runs
      # the Pico bridge's resolve-board.cmake with cmake -P.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            git
            python
            cmake
            mingw-w64-x86_64-cppcheck

      - name: Expose cppcheck
        run: |
          printf '#!/bin/sh\nexec /mingw64/bin/cppcheck.exe "$@"\n' > /usr/bin/cppcheck
          chmod +x /usr/bin/cppcheck
          cppcheck --version

      - name: Verify compiler
        run: |
          uname -a
          c++ --version | head -1
          g++ --version | head -1
          gcc --version | head -1
          cmake --version | head -1

      - name: Bootstrap from source
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure --compiler g++ --build ${{ matrix.build }}

      - name: Build
        run: ./build.sh

      # The check tool runs a native MinGW-w64 cppcheck, whose addon runs on
      # MSYS python, all from MSYS paths. The test suite only sees its exit
      # status, so run it here first where its output is visible: the tool
      # on a small subtree, then cppcheck and the addon directly.
      - name: Smoke-test the check tool
        run: |
          status=0
          out/bin/check -v modules/mm/parse || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::check exited $status; cppcheck and the addon directly"
            command -v python python3 || true
            MM_CHECK_EXCEPTIONS="$PWD/out/check-exceptions.txt" \
              cppcheck --std=c++20 --language=c++ --verbose \
              --suppress=syntaxError --suppress=missingIncludeSystem \
              --error-exitcode=1 \
              --addon="$PWD/tools/check/cppcheck/cpp20_rules.py" \
              "$PWD/modules/mm/parse/src/cursor.cpp" || echo "cppcheck exited $?"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Test
        run: ./test.sh

      - name: Check the manifest tree against itself
        run: ./model.sh

      - name: Generate documentation
        run: ./document.sh

      # The recovery path never runs during a successful bootstrap, so it is
      # exercised explicitly. A stale out/ or gcm.cache would let it pass
      # without recompiling anything, so it runs in a pristine copy.
      - name: Verify the bootstrap fallback
        if: matrix.build == 'debug'
        run: |
          FALLBACK_DIR="$(cygpath -u "${RUNNER_TEMP}")/fallback"
          rm -rf "$FALLBACK_DIR" && mkdir -p "$FALLBACK_DIR"
          git archive HEAD | tar -x -C "$FALLBACK_DIR"
          cd "$FALLBACK_DIR"
          test ! -e out && test ! -e gcm.cache
          B=out; F=-std=c++20
          mkdir -p $B/modules/mm/mdy/src $B/modules/mm/build/src \
                   $B/modules/mm/configure/src $B/tools/build
          for f in modules/mm/mdy/mdy.cppm modules/mm/mdy/src/mdy.cpp \
                   modules/mm/configure/configure.cppm \
                   modules/mm/configure/src/configure.cpp \
                   modules/mm/build/build.cppm modules/mm/build/src/build.cpp \
                   tools/build/build.cpp; do
            c++ -fmodules-ts $F -x c++ -c "$f" -o "$B/${f%.*}.o"
          done
          c++ $F $B/modules/mm/mdy/mdy.o $B/modules/mm/mdy/src/mdy.o \
                 $B/modules/mm/build/build.o $B/modules/mm/build/src/build.o \
                 $B/modules/mm/configure/configure.o \
                 $B/modules/mm/configure/src/configure.o \
                 $B/tools/build/build.o -o $B/build1
          ./$B/build1 -h
